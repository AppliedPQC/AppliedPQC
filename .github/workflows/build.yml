name: Build the book and check the site

# The site is published from AppliedPQC/AppliedPQC.github.io, which holds the
# page templates and build scripts and checks out this repository for the
# content they render.
#
# This workflow does the same thing in reverse: it checks out that repository
# and runs the same build and the same checks, so a chapter change that would
# break a page is caught here, in review, rather than after publishing. It does
# not deploy -- publishing this repository's Pages as well would put a second,
# competing copy of the site at appliedpqc.io/AppliedPQC/.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned so the landing page is rendered by the same pandoc the change
  # was tested against, independent of what the runner image ships.
  PANDOC_VERSION: '3.1.3'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check out the site templates and build scripts
        uses: actions/checkout@v4
        with:
          repository: AppliedPQC/AppliedPQC.github.io
          path: site-repo

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-pictures texlive-science

      - name: Install pandoc
        run: |
          set -euo pipefail
          url="https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz"
          curl -sSfL --retry 3 --retry-delay 5 -o /tmp/pandoc.tar.gz "$url"
          tar -xzf /tmp/pandoc.tar.gz -C /tmp
          sudo install -m 0755 "/tmp/pandoc-${PANDOC_VERSION}/bin/pandoc" /usr/local/bin/pandoc

      - name: Verify build tools
        run: |
          set -euo pipefail
          for tool in pdflatex pandoc; do
            if ! command -v "$tool" >/dev/null; then
              echo "::error::$tool is not available on the runner"
              exit 1
            fi
            printf '%-10s %s\n' "$tool" "$(command -v "$tool")"
          done
          pandoc --version | head -1
          # Fail loudly if the pinned version is not what we resolved to.
          pandoc --version | head -1 | grep -qw "${PANDOC_VERSION}" || {
            echo "::error::expected pandoc ${PANDOC_VERSION}"
            exit 1
          }

      - name: Build PDF
        run: |
          make

      - name: Build the site
        run: |
          set -euo pipefail
          python3 -m pip install --quiet "jinja2==3.1.*"
          # The listings data is generated from chapters/*.tex; fail rather than
          # build a playground that disagrees with the book.
          python3 sage/playground/extract_listings.py --check
          python3 site-repo/pages/build_site.py --source . site

      - name: Check the rendered site
        run: python3 site-repo/pages/check_site.py --source . site
