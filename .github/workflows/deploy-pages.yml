name: Deploy LaTeX book to GitHub Pages

on:
  push:
    branches: [main]
  # Pull requests build the book and render the landing page but do not
  # deploy, so a broken build is caught in review rather than on main.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Scope by ref so a pull-request run can never cancel a live deployment.
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned so the landing page is rendered by the same pandoc the change
  # was tested against, independent of what the runner image ships.
  PANDOC_VERSION: '3.1.3'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-pictures texlive-science

      - name: Install pandoc
        run: |
          set -euo pipefail
          url="https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz"
          curl -sSfL --retry 3 --retry-delay 5 -o /tmp/pandoc.tar.gz "$url"
          tar -xzf /tmp/pandoc.tar.gz -C /tmp
          sudo install -m 0755 "/tmp/pandoc-${PANDOC_VERSION}/bin/pandoc" /usr/local/bin/pandoc

      - name: Verify build tools
        run: |
          set -euo pipefail
          for tool in pdflatex pandoc; do
            if ! command -v "$tool" >/dev/null; then
              echo "::error::$tool is not available on the runner"
              exit 1
            fi
            printf '%-10s %s\n' "$tool" "$(command -v "$tool")"
          done
          pandoc --version | head -1
          # Fail loudly if the pinned version is not what we resolved to.
          pandoc --version | head -1 | grep -qw "${PANDOC_VERSION}" || {
            echo "::error::expected pandoc ${PANDOC_VERSION}"
            exit 1
          }

      - name: Build PDF
        run: |
          make

      - name: Prepare Pages site
        run: |
          set -euo pipefail
          mkdir -p site
          cp apqc.pdf site/apqc.pdf
          cp apqc.pdf site/main.pdf   # alias for previously published links
          # The landing page is the repository README, so the two cannot
          # drift apart.  gfm keeps GitHub's tables and autolinks; the
          # chrome and styling live in .github/pages/.
          pandoc README.md \
            --from=gfm --to=html5 --standalone \
            --template=.github/pages/template.html \
            --variable=pagetitle="Applied Post-Quantum Cryptography" \
            --variable=lang=en \
            --include-in-header=.github/pages/head.html \
            --include-before-body=.github/pages/before-body.html \
            --output=site/index.html
          # The runnable playground.  Same template and chrome; the extra
          # header include pulls in the Sage Cell embed.
          pandoc .github/pages/playground.md \
            --from=gfm --to=html5 --standalone \
            --template=.github/pages/template.html \
            --variable=pagetitle="Playground -- Applied Post-Quantum Cryptography" \
            --variable=lang=en \
            --include-in-header=.github/pages/head.html \
            --include-in-header=.github/pages/playground-head.html \
            --include-before-body=.github/pages/playground-before-body.html \
            --output=site/playground.html
          # One page per chapter, every book listing a runnable cell.  These
          # are written directly as HTML, not via pandoc: a quarter of the
          # listings contain a blank line, which ends a CommonMark raw-HTML
          # block and would silently shred the cell into paragraph tags.
          python3 sage/playground/extract_listings.py --check
          python3 .github/pages/build_book_pages.py site
          touch site/.nojekyll

      - name: Check the rendered site
        run: |
          set -euo pipefail
          # A silently empty or malformed page would still deploy, so assert
          # the markers that prove the render actually happened.
          test -s site/index.html
          test -s site/apqc.pdf
          grep -q '<title>Applied Post-Quantum Cryptography</title>' site/index.html
          grep -q 'href="apqc.pdf"' site/index.html
          grep -q '<main>' site/index.html
          # The custom template exists to keep pandoc's default stylesheet
          # out; if it ever reappears it silently overrides the real one.
          if grep -q 'max-width: 36em' site/index.html; then
            echo "::error::pandoc's default stylesheet leaked into the page"
            exit 1
          fi
          test "$(grep -c 'name=\"viewport\"' site/index.html)" = "1"
          grep -q 'href="playground.html"' site/index.html
          # The playground is worthless if the Sage Cell embed or the cells
          # themselves fail to render, so assert both.
          test -s site/playground.html
          grep -q 'embedded_sagecell.js' site/playground.html
          cells="$(grep -c 'type="text/x-sage"' site/playground.html)"
          test "$cells" -ge 8 || {
            echo "::error::only $cells Sage cells rendered; raw HTML was mangled"
            exit 1
          }
          # Every cell bootstraps from raw.githubusercontent.com; a cell that
          # lost that line would silently fail for every visitor.
          test "$(grep -c 'sage/playground.py' site/playground.html)" -ge 8
          echo "landing page: $(wc -c < site/index.html) bytes, PDF: $(wc -c < site/apqc.pdf) bytes"
          echo "playground: $(wc -c < site/playground.html) bytes, $cells cells"
          # The book pages: every listing must have survived as a live cell.
          test -s site/book-code.html
          pages="$(ls site/playground-*.html | wc -l)"
          book="$(cat site/playground-*.html | grep -c 'type="text/x-sage"')"
          expected="$(python3 -c "import json;d=json.load(open('sage/playground/book_listings.json'));print(sum(1 for c in d['chapters'] for l in c['listings'] if l['runnable']))")"
          test "$book" = "$expected" || {
            echo "::error::$book book cells rendered, expected $expected"
            exit 1
          }
          # A shredded cell shows up as book code leaking into a <p>.
          if grep -lq '<p>[a-z_]* = ' site/playground-*.html; then
            echo "::error::a listing was mangled out of its cell"
            exit 1
          fi
          echo "book pages: $pages chapters, $book runnable cells"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Pull requests validate the build above; only main publishes.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
