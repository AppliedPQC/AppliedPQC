name: Deploy LaTeX book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-pictures texlive-science pandoc

      - name: Build PDF
        run: |
          make

      - name: Prepare Pages site
        run: |
          mkdir -p site
          cp apqc.pdf site/apqc.pdf
          cp apqc.pdf site/main.pdf   # alias for previously published links
          # The landing page is the repository README, so the two cannot
          # drift apart.  gfm keeps GitHub's tables and autolinks; the
          # chrome and styling live in .github/pages/.
          pandoc README.md \
            --from=gfm --to=html5 --standalone \
            --variable=pagetitle="Applied Post-Quantum Cryptography" \
            --include-in-header=.github/pages/head.html \
            --include-before-body=.github/pages/before-body.html \
            --include-after-body=.github/pages/after-body.html \
            --output=site/index.html
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
