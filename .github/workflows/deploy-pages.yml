name: Deploy LaTeX book to GitHub Pages

on:
  push:
    branches: [main]
  # Pull requests build the book and render the landing page but do not
  # deploy, so a broken build is caught in review rather than on main.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Scope by ref so a pull-request run can never cancel a live deployment.
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned so the landing page is rendered by the same pandoc the change
  # was tested against, independent of what the runner image ships.
  PANDOC_VERSION: '3.1.3'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-pictures texlive-science

      - name: Install pandoc
        run: |
          set -euo pipefail
          url="https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz"
          curl -sSfL --retry 3 --retry-delay 5 -o /tmp/pandoc.tar.gz "$url"
          tar -xzf /tmp/pandoc.tar.gz -C /tmp
          sudo install -m 0755 "/tmp/pandoc-${PANDOC_VERSION}/bin/pandoc" /usr/local/bin/pandoc

      - name: Verify build tools
        run: |
          set -euo pipefail
          for tool in pdflatex pandoc; do
            if ! command -v "$tool" >/dev/null; then
              echo "::error::$tool is not available on the runner"
              exit 1
            fi
            printf '%-10s %s\n' "$tool" "$(command -v "$tool")"
          done
          pandoc --version | head -1
          # Fail loudly if the pinned version is not what we resolved to.
          pandoc --version | head -1 | grep -qw "${PANDOC_VERSION}" || {
            echo "::error::expected pandoc ${PANDOC_VERSION}"
            exit 1
          }

      - name: Build PDF
        run: |
          make

      - name: Prepare Pages site
        run: |
          set -euo pipefail
          mkdir -p site
          cp apqc.pdf site/apqc.pdf
          cp apqc.pdf site/main.pdf   # alias for previously published links
          # The landing page is the repository README, so the two cannot
          # drift apart.  gfm keeps GitHub's tables and autolinks; the
          # chrome and styling live in .github/pages/.
          pandoc README.md \
            --from=gfm --to=html5 --standalone \
            --variable=pagetitle="Applied Post-Quantum Cryptography" \
            --include-in-header=.github/pages/head.html \
            --include-before-body=.github/pages/before-body.html \
            --include-after-body=.github/pages/after-body.html \
            --output=site/index.html
          touch site/.nojekyll

      - name: Check the rendered site
        run: |
          set -euo pipefail
          # A silently empty or malformed page would still deploy, so assert
          # the markers that prove the render actually happened.
          test -s site/index.html
          test -s site/apqc.pdf
          grep -q '<title>Applied Post-Quantum Cryptography</title>' site/index.html
          grep -q 'href="apqc.pdf"' site/index.html
          grep -q '<main>' site/index.html
          echo "landing page: $(wc -c < site/index.html) bytes, PDF: $(wc -c < site/apqc.pdf) bytes"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Pull requests validate the build above; only main publishes.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
